<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景深空网格渐变 -->
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#131C31" />
    </linearGradient>

    <!-- 左侧图标区域青蓝光晕 -->
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 160) rotate(90) scale(210 250)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- 右侧光晕 -->
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 160) rotate(90) scale(240 300)">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- 标题文字渐变 -->
    <linearGradient id="titleGrad" x1="310" y1="90" x2="680" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- 新版图标专属渐变：玻璃质感 D 外框 -->
    <linearGradient id="dGlassGrad" x1="115" y1="95" x2="215" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="dStrokeGrad" x1="115" y1="95" x2="215" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.35" />
    </linearGradient>

    <!-- 新版图标专属渐变：T 形与向前执行箭头（青蓝到翠绿） -->
    <linearGradient id="tArrowGrad" x1="175" y1="110" x2="255" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- 节点球体径向渐变 -->
    <radialGradient id="cyanNode" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </radialGradient>
    <radialGradient id="indigoNode" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="55%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </radialGradient>
    <radialGradient id="emeraldNode" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="55%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>

    <!-- 图标霓虹外发光滤镜 -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 点阵背景图案 -->
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" opacity="0.55" />
    </pattern>
  </defs>

  <!-- 外框与背景 -->
  <rect x="2" y="2" width="1196" height="316" rx="24" fill="url(#bannerBg)" stroke="#1E293B" stroke-width="2" />
  <rect x="2" y="2" width="1196" height="316" rx="24" fill="url(#dotGrid)" />
  <rect x="2" y="2" width="1196" height="316" rx="24" fill="url(#glowLeft)" />
  <rect x="2" y="2" width="1196" height="316" rx="24" fill="url(#glowRight)" />

  <!-- 左侧：最新版 D + T 工作流节点发光图标 -->
  <g transform="translate(0, 0)">
    <!-- 圆角玻璃拟态图标底座 -->
    <rect x="84" y="64" width="192" height="192" rx="44" fill="#131B2E" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35" />
    <rect x="86" y="66" width="188" height="188" rx="42" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />

    <!-- 1. 玻璃拟态粗体 D 形轨道（带内部同心纹路） -->
    <path d="M126 100 H156 C188 100 212 125 212 160 C212 195 188 220 156 220 H126 C120.5 220 116 215.5 116 210 V110 C116 104.5 120.5 100 126 100 Z" fill="none" stroke="url(#dGlassGrad)" stroke-width="22" stroke-linejoin="round" />
    <path d="M126 100 H156 C188 100 212 125 212 160 C212 195 188 220 156 220 H126 C120.5 220 116 215.5 116 210 V110 C116 104.5 120.5 100 126 100 Z" fill="none" stroke="url(#dStrokeGrad)" stroke-width="1.5" stroke-linejoin="round" />
    <!-- D 内部装饰细轨 -->
    <path d="M126 100 H156 C188 100 212 125 212 160 C212 195 188 220 156 220 H126" fill="none" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4" />

    <!-- 2. 右侧 T 字结构与向前执行箭头（带外发光） -->
    <g filter="url(#neonGlow)">
      <!-- T 顶部横梁（玻璃胶囊） -->
      <rect x="176" y="108" width="54" height="13" rx="6.5" fill="url(#tArrowGrad)" fill-opacity="0.35" stroke="#5EEAD4" stroke-width="1.5" />
      <!-- T 竖柱衔接 -->
      <path d="M203 121 V154" stroke="url(#tArrowGrad)" stroke-width="12" stroke-linecap="round" opacity="0.5" />
      <!-- 向前执行粗箭头 -->
      <path d="M204 162 H228 V147 L253 168 L228 189 V174 H204 Z" fill="url(#tArrowGrad)" stroke="#A7F3D0" stroke-width="1.2" stroke-linejoin="round" />
    </g>

    <!-- 3. 工作流节点连线（发光拓扑边） -->
    <g filter="url(#neonGlow)">
      <line x1="126" y1="112" x2="126" y2="208" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round" />
      <line x1="126" y1="112" x2="168" y2="168" stroke="#60A5FA" stroke-width="3.2" stroke-linecap="round" />
      <line x1="126" y1="208" x2="168" y2="168" stroke="#818CF8" stroke-width="3.2" stroke-linecap="round" />
      <line x1="168" y1="168" x2="204" y2="168" stroke="#34D399" stroke-width="3.2" stroke-linecap="round" />
    </g>

    <!-- 4. 四个核心立体发光节点球 -->
    <circle cx="126" cy="112" r="10.5" fill="url(#cyanNode)" stroke="#E0F2FE" stroke-width="1.2" />
    <circle cx="126" cy="208" r="10.5" fill="url(#cyanNode)" stroke="#E0F2FE" stroke-width="1.2" />
    <circle cx="168" cy="168" r="10.5" fill="url(#indigoNode)" stroke="#E0E7FF" stroke-width="1.2" />
    <circle cx="204" cy="168" r="10.5" fill="url(#emeraldNode)" stroke="#D1FAE5" stroke-width="1.2" />
  </g>

  <!-- 中部：中英双语品牌名 + Slogan + 核心标签 -->
  <g transform="translate(320, 0)">
    <!-- 主标题：duomiT · 多面体 -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="url(#titleGrad)">
      duomiT
    </text>

    <!-- 分隔竖线与中文名“多面体” -->
    <line x1="226" y1="92" x2="226" y2="138" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    <text x="248" y="130" font-family="&#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="38" font-weight="700" letter-spacing="2" fill="#38BDF8">
      多面体
    </text>

    <!-- 副标题定位描述 -->
    <text x="0" y="178" font-family="&#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, sans-serif" font-size="20" font-weight="500" fill="#CBD5E1">
      针对 AI 智能组织的工作流与执行中间件
    </text>
    <text x="0" y="208" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">
      From User Goals to Execution — Connecting Tasks, Tools, Delivery &amp; Reusable Experience
    </text>

    <!-- 底部四个核心维度胶囊标签 -->
    <g transform="translate(0, 232)">
      <!-- 标签 1: 目标驱动 -->
      <rect x="0" y="0" width="96" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
      <text x="48" y="18" text-anchor="middle" font-family="&#39;PingFang SC&#39;, sans-serif" font-size="13" fill="#7DD3FC">🎯 目标驱动</text>

      <!-- 标签 2: 任务编排 -->
      <rect x="108" y="0" width="96" height="28" rx="14" fill="#1E293B" stroke="#818CF8" stroke-width="1" stroke-opacity="0.5" />
      <text x="156" y="18" text-anchor="middle" font-family="&#39;PingFang SC&#39;, sans-serif" font-size="13" fill="#A5B4FC">⚡ 任务编排</text>

      <!-- 标签 3: 工具连接 -->
      <rect x="216" y="0" width="96" height="28" rx="14" fill="#1E293B" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5" />
      <text x="264" y="18" text-anchor="middle" font-family="&#39;PingFang SC&#39;, sans-serif" font-size="13" fill="#67E8F9">🔌 工具连接</text>

      <!-- 标签 4: 经验沉淀 -->
      <rect x="324" y="0" width="96" height="28" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" />
      <text x="372" y="18" text-anchor="middle" font-family="&#39;PingFang SC&#39;, sans-serif" font-size="13" fill="#6EE7B7">💎 经验沉淀</text>
    </g>
  </g>

  <!-- 右侧：抽象拓扑工作流线框装饰 -->
  <g transform="translate(880, 40)" opacity="0.85">
    <!-- 连接线 -->
    <path d="M60 120 L140 60 L230 100 L190 190 L90 180 Z" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35" fill="none" />
    <path d="M140 60 L190 190 M60 120 L230 100 M90 180 L140 60" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity="0.4" />

    <!-- 浮动晶体与发光节点 -->
    <polygon points="140,48 152,55 152,68 140,75 128,68 128,55" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <polygon points="230,88 242,95 242,108 230,115 218,108 218,95" fill="#1E293B" stroke="#818CF8" stroke-width="2" />
    <polygon points="190,178 202,185 202,198 190,205 178,198 178,185" fill="#1E293B" stroke="#10B981" stroke-width="2" />
    <circle cx="60" cy="120" r="6" fill="#38BDF8" />
    <circle cx="90" cy="180" r="6" fill="#34D399" />
  </g>
</svg>
