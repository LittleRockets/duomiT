[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "duomit"
version = "0.1.0.dev38"
description = "Public contracts, API model adapters and reference workflows for duomit"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["duomit*"]


[tool.setuptools.package-data]
duomit = ["*.schema.json", "web/*.html", "web/*.svg"]
